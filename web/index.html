<!DOCTYPE html>
<html lang="fr" style="background:#010613;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#010613">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="METABOOST">
    <title>MetaBoost</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: #010613;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      #root {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        background: #010613;
      }

      /* Propagation de hauteur pour React Native Web */
      #root > div,
      #root > div > div {
        height: 100%;
        overflow: hidden;
      }

      /* Empêche le zoom sur les inputs iOS */
      input, select, textarea { font-size: 16px; }

      /* ── Splash HTML ── visible avant que React charge ──────────────────────── */
      #mb-splash {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #010613;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(env(safe-area-inset-top, 0px), 24px);
        padding-bottom: max(env(safe-area-inset-bottom, 0px), 24px);
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.15s ease;
      }
      #mb-splash.mb-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .mb-badge {
        width: 60px; height: 60px; border-radius: 18px;
        background: #00C8D4;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 16px;
        font-size: 30px;
        line-height: 1;
      }
      .mb-title {
        font-size: 32px; font-weight: 900; color: #fff;
        letter-spacing: 4px; margin: 0 0 8px;
        text-align: center;
      }
      .mb-sub {
        font-size: 13px; color: rgba(255,255,255,0.4);
        text-align: center; line-height: 20px; margin: 0 0 36px;
      }
      .mb-headline { text-align: center; margin-bottom: 36px; }
      .mb-headline p { margin: 0; line-height: 1.1; }
      .mb-eco  { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.3); letter-spacing: 3px; }
      .mb-sport { font-size: 28px; font-weight: 900; color: #00C8D4; }
      .mb-med  { font-size: 28px; font-weight: 900; color: #E2AA27; }
      .mb-gen  { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.3); letter-spacing: 3px; }

      .mb-buttons { width: 100%; max-width: 360px; }
      .mb-btn-p {
        display: block; width: 100%;
        background: #00C8D4; border: none; border-radius: 14px;
        padding: 18px; margin-bottom: 10px;
        font-size: 15px; font-weight: 900; color: #010613;
        letter-spacing: 1.5px; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }
      .mb-btn-s {
        display: block; width: 100%;
        background: transparent;
        border: 1.5px solid rgba(255,255,255,0.2); border-radius: 14px;
        padding: 18px;
        font-size: 15px; font-weight: 700; color: #fff;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }
    </style>
  </head>

  <body>
    <!-- Page d'accueil HTML pure — s'affiche AVANT React, garantie sur iOS Safari -->
    <div id="mb-splash">
      <div class="mb-badge">⚡</div>
      <p class="mb-title">METABOOST</p>
      <p class="mb-sub">L'écosystème Sport &amp; Médical<br>nouvelle génération</p>

      <div class="mb-headline">
        <p class="mb-eco">L'ÉCOSYSTÈME</p>
        <p class="mb-sport">SPORT &amp;</p>
        <p class="mb-med">MÉDICAL</p>
        <p class="mb-gen">NOUVELLE GÉNÉRATION.</p>
      </div>

      <div class="mb-buttons">
        <button class="mb-btn-p"
          onclick="window.__mb_action='register'; document.getElementById('mb-splash').classList.add('mb-hidden'); window.dispatchEvent(new CustomEvent('mb-action'));">
          S'INSCRIRE →
        </button>
        <button class="mb-btn-s"
          onclick="window.__mb_action='login'; document.getElementById('mb-splash').classList.add('mb-hidden'); window.dispatchEvent(new CustomEvent('mb-action'));">
          SE CONNECTER
        </button>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Keyboard viewport offset
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        function update() {
          var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
          document.documentElement.style.setProperty('--kb-offset', kb + 'px');
        }
        vv.addEventListener('resize', update);
        vv.addEventListener('scroll', update);
        update();
      })();

      // Empêche le scroll/rebond iOS
      document.addEventListener('scroll', function (e) {
        e.preventDefault(); window.scrollTo(0, 0);
      }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length === 1) e.preventDefault();
      }, { passive: false });
    </script>
  </body>
</html>
